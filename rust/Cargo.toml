[workspace]
resolver = "2"
members = ["crates/addin", "vendor/ones_addin", "vendor/ones_addin_derive"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
# A Rust panic that unwinds out of an `extern "C"` frame into the platform is
# undefined behaviour, so aborting is the only safe option. Everything the
# component exposes returns a value instead of panicking, and the 1C side never
# sees an exception from the ABI: a failure travels back as an empty result plus
# the message read by the next call.
panic = "abort"
lto = true
codegen-units = 1
# `nm -D` on the Linux library must show exactly the five dynamic entry points
# the platform looks for and nothing else. Only release builds lose symbols; for
# a backtrace, rebuild with `--config 'profile.release.strip="debuginfo"'`.
strip = "symbols"
# Measured here, not inherited: the libraries travel inside a 1C template, so size
# is the objective, and "z" wins where it counts - on Windows it is 18 per cent
# smaller than "s" (3 130 880 B against 3 829 760 B, size-first std, both
# libraries built with -Z build-std). On Linux "s" is 2 per cent smaller
# (596 704 B against 610 144 B), which does not pay for a second profile: the
# Windows library is five times the size of the Linux one. Size-first std
# matters far more than this choice - it takes 37 per cent off the Linux library
# and 19 off the Windows one. Numbers, method and the speed measurement:
# T001 in docs/plan/index.md.
opt-level = "z"
